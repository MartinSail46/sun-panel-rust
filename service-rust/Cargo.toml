[package]
name = "sun-panel-rust"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = { version = "0.11.1", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "sync", "time", "io-util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "timeout", "set-header"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.28", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
