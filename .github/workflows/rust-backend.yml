name: Verify Sun-Panel Rust

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ["**"]
    paths:
      - "service-rust/**"
      - "src/**"
      - "build/**"
      - "scripts/**"
      - "tests/**"
      - "index.html"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".npmrc"
      - "public/**"
      - "package.json"
      - "components.json"
      - "THIRD_PARTY_NOTICES.txt"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vite.config.mts"
      - "eslint.config.mjs"
      - ".github/workflows/rust-backend.yml"
  pull_request:
    paths:
      - "service-rust/**"
      - "src/**"
      - "build/**"
      - "scripts/**"
      - "tests/**"
      - "index.html"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".npmrc"
      - "public/**"
      - "package.json"
      - "components.json"
      - "THIRD_PARTY_NOTICES.txt"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vite.config.mts"
      - "eslint.config.mjs"
      - ".github/workflows/rust-backend.yml"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service-rust
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy, llvm-tools-preview
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-llvm-cov
            service-rust/target
          key: ${{ runner.os }}-rust-1.99.1-cov-0.9.1-${{ hashFiles('service-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.99.1-cov-0.9.1-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Unit and integration tests with production line coverage
        run: ./scripts/coverage.sh

  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_GLOB_API_URL: /api
      VITE_GLOB_APP_PWA: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: "9.4.0"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.0"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm run lint
      - name: Frontend behavior tests and measured module coverage
        run: pnpm run test:coverage
      - name: Type check
        run: pnpm run type-check
      - name: Production build
        run: pnpm run build-only

  container:
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.0"
      - name: Check default deployment
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: sun-panel-rust:test
          cache-from: type=gha,scope=rust-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=rust-${{ matrix.platform }}
      - name: Run isolated container regression
        env:
          SUN_PANEL_TEST_IMAGE: sun-panel-rust:test
        run: node scripts/container-smoke.mjs
